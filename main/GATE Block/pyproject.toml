[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-block"
version = "1.0.0"
description = "Block 1 of the KYC Document Agent: document check, ID merge, quality gate and Laya-routed decision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "pillow>=10.0", "pyyaml>=6.0"]

[project.optional-dependencies]
laya = ["laya==0.4.31"]
heic = ["pillow-heif"]
test = ["pytest>=8"]

[project.scripts]
gate-block = "gate_block.cli:main"

[tool.setuptools]
packages = ["gate_block", "gate_block.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
